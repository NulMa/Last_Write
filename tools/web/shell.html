<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAST_WRITE</title>
<style>
  html,body{margin:0;height:100%;background:#06080e;overflow:hidden}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;outline:none;
         width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh}
  #msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
       color:#8e99b8;font:14px ui-monospace,monospace;pointer-events:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas></div>
<div id="msg">LOADING A:\LAST_WRITE.EXE ...</div>
<script>
  /* 방향키·스페이스가 부모 페이지를 스크롤하지 않게 */
  window.addEventListener('keydown', function (e) {
    if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(e.key) >= 0) e.preventDefault();
  }, { passive: false });
  var canvas = document.getElementById('canvas');
  canvas.addEventListener('click', function () { canvas.focus(); });
  var Module = {
    canvas: canvas,
    print: function () {}, printErr: function () {},
    onRuntimeInitialized: function () { document.getElementById('msg').remove(); canvas.focus(); }
  };
</script>
{{{ SCRIPT }}}
</body>
</html>
