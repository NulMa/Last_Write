# 제작 수기(devlog/)를 GitHub Pages 로 올린다 → https://nulma.github.io/floppy-proto/
name: devlog-pages

on:
  push:
    branches: [main]
    paths: ["devlog/**", ".github/workflows/devlog-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: devlog
      - id: deployment
        uses: actions/deploy-pages@v4
